name: test

on:
  push:
  pull_request:

jobs:
  release-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Doctor
        run: python -m metropulse_lab doctor
      - name: Unit and release tests
        run: python -m unittest discover -s tests -t .
      - name: All incident lifecycles
        run: python -m metropulse_lab test-all
